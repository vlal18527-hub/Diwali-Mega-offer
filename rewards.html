<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#140836">
<title>मेरे वाउचर – Diwali Spin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd03b;--gold-light:#fff3b0;--soft:#e2d9f8;--muted:#b5a6dc;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;min-height:100vh;line-height:1.55;overflow-x:hidden;
 background:radial-gradient(circle at 50% 0%,#341170 0%,#140735 55%,#070318 100%) fixed}
.wrap{width:min(720px,100% - 32px);margin:0 auto;padding:18px 0 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--gold-light);font-weight:700;font-size:.85rem;padding:9px 16px;border-radius:30px;border:1px solid rgba(255,215,90,.4);background:rgba(255,255,255,.07)}
.logo{font-family:'Cinzel Decorative',Georgia,serif;font-weight:900;color:var(--gold);font-size:1rem;white-space:nowrap}
h1{font-family:'Cinzel Decorative',Georgia,serif;color:var(--gold);font-size:clamp(1.4rem,5vw,2rem);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--soft);font-size:.92rem;margin-bottom:18px;text-wrap:balance}
.who{text-align:center;color:#38bdf8;font-weight:700;margin-bottom:18px;font-size:.9rem;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{padding:14px;border-radius:18px;text-align:center;background:linear-gradient(160deg,rgba(35,16,78,.85),rgba(15,6,40,.94));border:1px solid rgba(255,215,90,.32)}
.stat b{display:block;font-size:1.5rem;color:var(--gold)}
.stat span{font-size:.78rem;color:var(--muted)}
.card{position:relative;margin-bottom:14px;padding:18px;border-radius:22px;background:linear-gradient(160deg,rgba(35,16,78,.9),rgba(15,6,40,.95));border:1.5px solid rgba(255,215,90,.5);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.card.expired{opacity:.6;border-color:rgba(251,113,133,.5)}
.demo{display:block;text-align:center;font-weight:800;font-size:.78rem;padding:6px 10px;margin-bottom:12px;border-radius:12px;background:rgba(251,113,133,.18);border:1px dashed var(--bad);color:#fecdd3}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.title{font-weight:800;font-size:1.05rem;color:var(--gold-light)}
.badge{font-size:.7rem;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(52,211,153,.2);color:#86efac;border:1px solid var(--ok);white-space:nowrap}
.expired .badge{background:rgba(251,113,133,.2);color:#fecdd3;border-color:var(--bad)}
.code{display:flex;gap:8px;margin:14px 0}
.code code{flex:1;min-width:0;padding:12px 14px;border-radius:14px;background:rgba(8,3,26,.75);border:1px dashed rgba(255,215,90,.55);color:var(--gold);font-weight:800;letter-spacing:.06em;font-size:.95rem;overflow-wrap:anywhere}
.copy{flex:0 0 auto;padding:0 16px;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-family:inherit;color:#3d1000;background:linear-gradient(135deg,#ffe27a,#ff9500)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:.8rem;color:var(--muted)}
.meta b{display:block;color:#fff;font-size:.88rem;margin-top:2px}
.note{margin-top:12px;font-size:.82rem;color:var(--soft)}
.empty{text-align:center;padding:34px 18px;border-radius:22px;border:1.5px dashed rgba(255,215,90,.4);background:rgba(255,255,255,.05)}
.empty .big{font-size:2.6rem}
.empty p{color:var(--soft);margin-top:8px;text-wrap:balance}
.cta{display:flex;justify-content:center;margin-top:16px;text-decoration:none;font-weight:900;color:#3d1000;padding:14px;border-radius:50px;background:linear-gradient(180deg,#fff5b8,#ffd03b 48%,#ff8c00)}
.rule{margin-top:22px;font-size:.76rem;color:var(--muted);text-align:center;text-wrap:balance}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);padding:11px 20px;border-radius:40px;background:#1b0b45;border:1.5px solid var(--gold);font-weight:700;font-size:.85rem;transition:transform .3s;z-index:9;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:420px){.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html#result">← वापस</a>
    <span class="logo">🪔 Diwali Spin</span>
  </div>

  <h1>🎁 मेरे वाउचर</h1>
  <p class="sub">10 लोगों को शेयर करने पर मिले सभी वाउचर यहाँ दिखते हैं।</p>
  <p class="who" id="who"></p>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>कुल वाउचर</span></div>
    <div class="stat"><b id="sActive">0</b><span>चालू वाउचर</span></div>
  </div>

  <div id="list"></div>

  <p class="rule"><a href="how-it-works.html" style="color:var(--gold)">Spin &amp; Voucher Rules</a> · <a href="terms.html" style="color:var(--gold)">Terms</a> · <a href="privacy-policy.html" style="color:var(--gold)">Privacy</a> · <a href="contact.html" style="color:var(--gold)">Contact</a><br><br></p>
  <p class="rule">हर वाउचर पर उसकी तारीख और वैधता (Valid Till) लिखी होती है। वैधता खत्म होने के बाद वाउचर काम नहीं करेगा।</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load() {
  let u = null;
  try { u = JSON.parse(localStorage.getItem('user')); } catch (e) {}
  if (u && Array.isArray(u.vouchers)) return { n: u.name, u: u.username, v: u.vouchers };
  const m = location.hash.match(/[#&]d=([^&]+)/);       // fallback when opened from file://
  if (m) { try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); } catch (e) {} }
  return { n: u && u.name, u: u && u.username, v: [] };
}
const fmt = d => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200); }
function copy(code) {
  const done = () => toast('📋 कोड कॉपी हो गया');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done, done);
  else { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); done(); }
}
function render() {
  const d = load();
  $('who').textContent = d.n ? d.n + ' (' + (d.u || '') + ')' : '';
  const now = Date.now();
  const items = (d.v || []).slice().reverse();
  const active = items.filter(v => new Date(v.validTill).getTime() > now).length;
  $('sTotal').textContent = items.length; $('sActive').textContent = active;
  if (!items.length) {
    $('list').innerHTML = '<div class="empty"><div class="big">🔒</div><p><b>अभी कोई वाउचर नहीं है।</b><br>10 लोगों को शेयर करें, पूरा होते ही आपका वाउचर यहाँ आ जाएगा।</p><a class="cta" href="index.html#refer">📲 शेयर करने जाएँ</a></div>';
    return;
  }
  $('list').innerHTML = items.map((v, i) => {
    const left = Math.ceil((new Date(v.validTill).getTime() - now) / 86400000);
    const expired = left <= 0;
    return '<div class="card ' + (expired ? 'expired' : '') + '">' +
      (v.demo ? '<span class="demo">⚠️ DEMO – यह असली वाउचर नहीं है, सिर्फ़ टेस्ट के लिए</span>' : '') +
      '<div class="row"><div class="title">🎁 ' + esc(v.title) + (v.value && !v.demo ? ' • ' + esc(v.value) : '') + '</div><span class="badge">' + (expired ? 'समाप्त' : 'चालू') + '</span></div>' +
      '<div class="code"><code>' + esc(v.code) + '</code><button class="copy" data-i="' + i + '" type="button">कॉपी</button></div>' +
      '<div class="meta"><div>मिलने की तारीख<b>' + fmt(v.earnedAt) + '</b></div><div>वैध (Valid Till)<b>' + fmt(v.validTill) + '</b></div>' +
      '<div>बचे दिन<b>' + (expired ? '0 दिन' : left + ' दिन') + '</b></div><div>वाउचर नंबर<b>#' + esc(v.id) + '</b></div></div>' +
      (v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') + '</div>';
  }).join('');
  document.querySelectorAll('.copy').forEach(b => b.onclick = () => copy(items[+b.dataset.i].code));
}
render();
</script>
</body>
</html>
